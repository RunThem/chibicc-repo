# CI (CodeReview 2026-10-24 B1). The Linux runner is native x86-64, so
# the full test set runs without Docker. There is no macOS job: the
# macos-latest arm64 pool kept failing to hand out a runner, and the
# front-end channels it carried (trivia, cst, expand, ast) already run
# inside test-all on Linux. Building the compiler on macOS stays a local
# check, and the thirdparty job carries tinycc, libpng, git and sqlite;
# cpython (tens of minutes to hours) stays on the manual Docker gates.
name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test (stage 1 + stage 2)
        run: make -j"$(nproc)" test-all
      - name: Library surface gates
        run: make check-library

  # Real projects compiled by chibicc and run through their own test
  # suites. The job waits for the unit gates first, so a broken tree does
  # not spend half an hour inside sqlite. Clones are cached under
  # thirdparty/ (the scripts pin their commits with git reset --hard);
  # the SSH clone URLs need the same rewrite the Dockerfile installs.
  thirdparty:
    needs: linux
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zlib1g-dev tcl-dev libtool \
            libcurl4-openssl-dev libexpat1-dev gettext
      - name: Clone public repos over HTTPS
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"
      - name: Restore the clone cache
        uses: actions/cache@v4
        with:
          path: thirdparty
          key: thirdparty-v1-${{ hashFiles('test/thirdparty/*.sh') }}
      - name: tinycc, libpng, git and sqlite
        run: make -j"$(nproc)" test-thirdparty THIRDPARTY="tinycc libpng git sqlite"
